<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Insets</title>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  html, body { margin: 0; background: #111; color: #eee; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  main { padding: calc(var(--sat) + 1rem) 1rem calc(var(--sab) + 1rem); }
  h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
  p { margin: 0 0 1rem; color: #9aa; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td { padding: .25rem 0; border-bottom: 1px solid #222; }
  td:last-child { text-align: right; color: #7fd1ff; }
  #status { margin-top: 1rem; color: #9f9; }
  /* Probes: the browser resolves each unit, we read the height back. */
  .probe { position: absolute; visibility: hidden; width: 1px; }
  #lvh { height: 100lvh } #svh { height: 100svh } #dvh { height: 100dvh }
  #sat { height: var(--sat) } #sab { height: var(--sab) }
</style>
<div class="probe" id="lvh"></div>
<div class="probe" id="svh"></div>
<div class="probe" id="dvh"></div>
<div class="probe" id="sat"></div>
<div class="probe" id="sab"></div>
<main>
  <h1>What this screen reports</h1>
  <p>Open this inside the installed app, not in Safari. It sends itself; the numbers are below in case it cannot.</p>
  <table id="out"></table>
  <div id="status">Measuring…</div>
</main>
<script>
  const px = (id) => Math.round(document.getElementById(id).getBoundingClientRect().height)
  const data = {
    standalone: (matchMedia("(display-mode: standalone)").matches ? "display-mode" : "") +
                (navigator.standalone ? " navigator.standalone" : "") || "no (browser tab)",
    innerHeight: innerHeight,
    innerWidth: innerWidth,
    screenHeight: screen.height,
    screenWidth: screen.width,
    dpr: devicePixelRatio,
    lvh: px("lvh"),
    svh: px("svh"),
    dvh: px("dvh"),
    safeTop: px("sat"),
    safeBottom: px("sab"),
    visualViewport: visualViewport ? Math.round(visualViewport.height) : null,
    visualOffsetTop: visualViewport ? Math.round(visualViewport.offsetTop) : null
  }

  const out = document.getElementById("out")
  for (const [k, v] of Object.entries(data)) {
    const tr = out.insertRow()
    tr.insertCell().textContent = k
    tr.insertCell().textContent = String(v)
  }

  // Sent to /lab/report, which is owner-only — the same place the player lab reports go.
  fetch("/lab/report", {
    method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({
      at: new Date().toISOString(),
      ua: navigator.userAgent,
      platform: "insets",
      width: innerWidth,
      height: innerHeight,
      results: data
    })
  }).then((r) => r.json().then((j) => {
    document.getElementById("status").textContent = r.ok ? "Sent. " + j.id : "Refused " + r.status + " — signed in as the owner?"
  })).catch((e) => {
    document.getElementById("status").textContent = "Could not send: " + e.message + " — a screenshot of the table does just as well."
  })
</script>
