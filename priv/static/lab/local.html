<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local player test</title>
<script defer src="/assets/js/app.js"></script>
<style>body{background:#111;color:#eee;font:14px system-ui;margin:16px} video{width:100%;max-width:640px;background:#000} pre{white-space:pre-wrap;color:#0f0}</style></head>
<body><h1>Local player (the site's own module)</h1>
<p>Plays <code>/lab/links</code> entry <code>?link=N</code> (default 0) through <code>startLocalPlayer</code>, the watch page's pipeline, on this bare page. <code>&controls=0</code> takes the controls off.</p>
<button id="go" style="font-size:18px;padding:8px 16px">Tap to start</button>
<video id="v" controls playsinline></video><pre id="log"></pre>
<script>
const $ = (id) => document.getElementById(id), log = (m) => { $("log").textContent += m + "\n" }
const params = new URLSearchParams(location.search)
if (params.get("controls") === "0") $("v").removeAttribute("controls")
if (params.get("mute") === "1") $("v").muted = true
$("go").onclick = async () => {
  $("go").disabled = true
  const v = $("v")
  const links = await (await fetch("/lab/links")).json().catch(() => [])
  const l = links[Number(params.get("link") || 0)]
  if (!l) { log("no such link (signed in as the owner?)"); return }
  const url = l.provider === "tb" ? l.url : `/lab/bytes?u=${encodeURIComponent(l.url)}`
  log("link: " + l.name)
  v.play().catch(() => {})
  const ctl = await window.rokiLocalPlayer(v, url, {onLog: log, onFail: (w) => log("FAIL " + w)})
  setInterval(() => {
    const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : {}
    $("log").textContent = $("log").textContent.replace(/\nframes[^\n]*$/, "") + `\nframes ${q.totalVideoFrames} t ${v.currentTime.toFixed(1)} rs ${v.readyState} ${v.videoWidth}×${v.videoHeight} ${v.paused ? "paused" : "playing"}${v.error ? " ERR " + v.error.message : ""} ${ctl && ctl.stats() ? (ctl.stats().bytes / 1e6).toFixed(1) + " MB" : ""}`
  }, 1000)
}
if (params.get("auto") === "1") $("go").click()
</script>
</body></html>
