<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Profile 3D lab · Roki</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* A mock of the profile page drawn with the WebGL cases (2026-11-24): alex's real favourites on
     carousels, the map and ratings cards on the banner, the recently watched on a carousel,
     and the watch history as a wall of covers by month. A snapshot (profile3d-data.json); nothing
     on the real site reads this. */
  :root { color-scheme: dark; --page: #0e0c10; --gold: #f4c430; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: #ece8ef; font: 15px/1.45 "Outfit", system-ui, sans-serif; }
  a { color: inherit; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .lab-note { position: fixed; right: 12px; bottom: 12px; z-index: 50; padding: 6px 10px; border-radius: 999px; background: #000a; border: 1px solid #ffffff22; color: #ffffffa0; }
  /* The site's gutters (px-4 / sm:px-6 / lg:px-12 / xl:px-16), no centred column: the 3D stages run
     edge to edge like the site's rows, only the words are inset. */
  .wrap { padding: 0 16px; }
  @media (min-width: 640px) { .wrap { padding: 0 24px; } }
  @media (min-width: 1024px) { .wrap { padding: 0 48px; } }
  @media (min-width: 1280px) { .wrap { padding: 0 64px; } }
  .bleed { margin: 0 -16px; }
  @media (min-width: 640px) { .bleed { margin: 0 -24px; } }
  @media (min-width: 1024px) { .bleed { margin: 0 -48px; } }
  @media (min-width: 1280px) { .bleed { margin: 0 -64px; } }

  /* the top: banner, name, numbers, and the pedestal at the right */
  /* The banner the user set, under a dark wash so the words and cards read over it (as on the
     real profile); a gradient when there is none. */
  .top { position: relative; overflow: hidden; background: radial-gradient(90% 120% at 80% 0%, #3a1f2e 0%, #1a1220 45%, var(--page) 80%) center / cover no-repeat; min-height: 440px; display: flex; align-items: flex-end; }
  .top::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--page) 0%, #0e0c10b3 35%, #0e0c1040 70%, #0e0c1066 100%), linear-gradient(to right, #0e0c10b3, transparent 60%); pointer-events: none; }
  .top .wrap { position: relative; z-index: 1; width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding-top: 90px; padding-bottom: 26px; }
  .cards { display: flex; gap: 40px; align-items: flex-end; }
  /* The two cards, editorial: no boxes — words in the page's type on the banner, the numbers in the
     serif, labels in the small capitals, the bars hairlines, the map in dots (or, in 3D, objects). */
  .cards .card { background: none; border: 0; backdrop-filter: none; padding: 0; text-shadow: 0 1px 12px #000c; }
  .cards .card h3 { font: 500 11px "JetBrains Mono", monospace; letter-spacing: .12em; color: #ffffffb3; display: flex; gap: 10px; align-items: baseline; }
  .cards .card h3 span { color: #ffffff80; }
  .cards .avg { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 0; }
  .cards .avg b { font: italic 400 56px/0.95 "Instrument Serif", serif; letter-spacing: -.01em; }
  .cards .avg .mono { color: #ffffff99; }
  .cards .bars { height: 92px; gap: 0; }
  .cards .bars li { align-items: center; }
  .cards .bars li i { width: 3px; border-radius: 3px; background: var(--c); box-shadow: 0 0 10px var(--c), 0 0 2px var(--c); }
  .cards .bars li span.n { font: 500 9.5px "JetBrains Mono", monospace; color: #ffffff99; }
  .cards .ticks li { font: 500 9.5px "JetBrains Mono", monospace; color: #ffffff70; }
  .cards .rtabs { background: none; gap: 4px; padding: 0; }
  .cards .rtabs button { font: 500 10.5px "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #ffffff80; padding: 3px 6px; border-radius: 0; border-bottom: 1px solid transparent; }
  .cards .rtabs button[aria-pressed="true"] { background: none; color: #fff; border-bottom-color: #fff; }
  .cards .top3 { font-size: 12.5px; color: #ffffffa6; } .cards .top3 b { font: italic 400 16px "Instrument Serif", serif; color: #fff; margin-left: 2px; }
  .card .map { position: relative; } .card .map canvas { display: block; width: 100%; }
  .maptip { position: absolute; transform: translate(-50%, calc(-100% - 12px)); pointer-events: none; white-space: nowrap; padding: 5px 10px; border-radius: 8px; background: #000d; border: 1px solid #ffffff26; font-size: 12.5px; color: #fff; z-index: 3; }
  .maptip b { font: italic 400 16px "Instrument Serif", serif; margin-left: 4px; color: #ffb37a; }
  .maptip[hidden] { display: none; }
  /* 3D: the globe and the piles of cases */
  .cards.objects .card .map.globe { width: 270px; height: 270px; aspect-ratio: auto; }
  .cards.objects .card .map.globe canvas { width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .cards.objects .card:last-child { width: 470px; }
  .stacks { position: relative; height: 270px; margin-top: 6px; }
  .stacks canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .slabels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .slabels span { position: absolute; left: 0; top: 0; margin-left: -12px; width: 24px; text-align: center; font: 500 10px "JetBrains Mono", monospace; transition: opacity .2s; }
  .slabels .sn { color: #fff; font: italic 400 16px "Instrument Serif", serif; }
  .slabels .ss { color: #ffffff80; }
  .card { border-radius: 16px; border: 1px solid #ffffff26; background: #00000059; backdrop-filter: blur(12px); padding: 14px; }
  .card h3 { margin: 0; font: 600 13px "Outfit"; letter-spacing: .06em; text-transform: uppercase; color: #ffffffb3; }
  .card h3 span { font-weight: 400; text-transform: none; letter-spacing: 0; color: #ffffff80; }
  .card .map { width: 290px; aspect-ratio: 960/470; margin-top: 8px; }
  .card .map svg { width: 100%; height: 100%; }
  .card .top3 { margin: 6px 0 0; font-size: 12px; color: #ffffff99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 290px; }
  .card .top3 b { color: #ffffffcc; font-weight: 500; }
  .card:last-child { width: 400px; }
  .rhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
  .avg { margin: 2px 0 0; color: #ffffffb3; font-size: 14px; } .avg b { font: 700 24px "Outfit"; color: #fff; }
  .rtabs { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: #ffffff1a; }
  .rtabs button { font: 600 11px "Outfit"; color: #ffffffcc; background: none; border: 0; padding: 4px 9px; border-radius: 8px; cursor: pointer; }
  .rtabs button[aria-pressed="true"] { background: #fff; color: #111; }
  .bars { list-style: none; margin: 10px 0 0; padding: 0; display: flex; align-items: flex-end; gap: 3px; height: 112px; }
  .bars li { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
  .bars li span.n { text-align: center; font-size: 9.5px; color: #ffffffb3; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .bars li i { display: block; border-radius: 3px 3px 0 0; transition: height .4s; }
  .ticks { list-style: none; margin: 3px 0 0; padding: 0; display: flex; gap: 3px; } .ticks li { flex: 1; text-align: center; font-size: 9.5px; color: #ffffff8c; }
  @media (max-width: 1100px) { .cards { flex-direction: column-reverse; align-items: stretch; gap: 26px; } .card:last-child, .card .map, .card .top3 { width: auto; max-width: none; } .cards.objects .card .map.globe { width: 100%; height: 300px; } .cards.objects .card:last-child { width: auto; } }
  @media (max-width: 900px) {
    .top .wrap { grid-template-columns: minmax(0, 1fr); }
    .cards { flex-direction: column-reverse; min-width: 0; }
    .card, .card:last-child { width: auto; min-width: 0; }
    .card .map, .card .top3 { width: auto; max-width: none; }
    .hero-num b { font-size: 52px; }
  }
  .who { display: flex; gap: 18px; align-items: center; }
  .who img, .who .ph { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid #ffffffcc; box-shadow: 0 8px 30px #0008; background: #ff6a13; display: grid; place-items: center; font: 800 40px "Outfit"; }
  .who h1 { margin: 0; font: italic 400 64px/1 "Instrument Serif", serif; }
  .nums { margin-top: 22px; display: flex; flex-direction: column; gap: 16px; max-width: 560px; text-shadow: 0 1px 12px #000c; }
  .hero-num b { display: block; font: italic 400 64px/0.95 "Instrument Serif", serif; letter-spacing: -.01em; }
  .hero-num span { display: block; margin-top: 6px; color: #ffffffa6; }
  .tally p { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; color: #ffffffb3; font-size: 14px; }
  .tally p b { font: 600 20px "Outfit"; color: #fff; letter-spacing: -.01em; margin-right: 4px; }
  .tally p span { display: inline-flex; align-items: center; gap: 6px; }
  .tally p i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tally p .eps { color: #ffffff80; }
  .tally p .eps::before { content: "·"; margin-right: 8px; color: #ffffff55; }
  .mix { display: flex; gap: 2px; height: 4px; margin-top: 10px; border-radius: 4px; overflow: hidden; max-width: 460px; }
  .mix i { display: block; }
  .seeall { display: inline-block; margin-top: 12px; font: 500 11px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: #fff; text-decoration: none; border-bottom: 1px solid #ffffff66; padding-bottom: 2px; }
  .seeall:hover { border-bottom-color: #fff; }
  .pedestal-box { position: relative; height: 380px; }
  .pedestal-box .caption { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; pointer-events: none; }
  .pedestal-box .caption b { display: block; font: italic 400 26px "Instrument Serif", serif; }
  .chips { position: absolute; top: 4px; left: 0; right: 0; display: flex; gap: 6px; justify-content: center; z-index: 2; }
  .chips button { font: 600 12px "Outfit"; color: #ddd; background: #ffffff12; border: 1px solid #ffffff26; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .chips button[aria-pressed="true"] { background: #fff; color: #111; }

  /* sections */
  section.shelf { margin: 28px 0 0; }
  section.shelf h2 { margin: 0 0 2px; font: 700 22px "Outfit"; display: flex; align-items: baseline; justify-content: center; gap: 10px; text-align: center; }
  section.shelf h2 small { font: 500 11px "JetBrains Mono"; color: #ffffff70; letter-spacing: .06em; text-transform: uppercase; }
  .stage { position: relative; height: 360px; overflow: hidden; transition: background-color .8s; background: transparent; }
  .stage canvas, .wallstage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  .stage.ring { height: 430px; }
  .stage.ring.two { height: 600px; }
  .stage.ring.inside { height: 460px; }
  .duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 0; }
  .duo section.shelf { min-width: 0; }
  .duo .stage.bleed { margin: 0; }
  .duo section.shelf:nth-child(odd) .stage.bleed { margin-left: -16px; }
  @media (min-width: 640px) { .duo section.shelf:nth-child(odd) .stage.bleed { margin-left: -24px; } .duo section.shelf:nth-child(even) .stage.bleed { margin-right: -24px; } }
  @media (min-width: 1024px) { .duo section.shelf:nth-child(odd) .stage.bleed { margin-left: -48px; } .duo section.shelf:nth-child(even) .stage.bleed { margin-right: -48px; } }
  @media (min-width: 1280px) { .duo section.shelf:nth-child(odd) .stage.bleed { margin-left: -64px; } .duo section.shelf:nth-child(even) .stage.bleed { margin-right: -64px; } }
  @media (max-width: 900px) { .duo { grid-template-columns: minmax(0, 1fr); } .duo section.shelf .stage.bleed { margin: 0 -16px !important; } }
  /* A phone: the stage only as tall as the ring needs, so a column of four does not leave a band
     of empty dark under each ring. */
  @media (max-width: 700px) { .duo .stage.ring { height: 250px; } .duo section.shelf { margin-top: 4px; } }
  section.shelf h2.under { margin: -18px 0 0; position: relative; z-index: 2; }
  @media (max-width: 700px) { .duo section.shelf h2.under { margin: -14px 0 0; } .duo .stage.ring { height: 220px; } .duo section.shelf { margin-top: 0; } }
  .shelfswitch { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 26px 0 0; }
  .shelfswitch a { font: 600 13px "Outfit"; color: #ddd; text-decoration: none; border: 1px solid #ffffff26; border-radius: 999px; padding: 6px 12px; }
  .shelfswitch a[aria-pressed="true"] { background: #fff; color: #111; border-color: #fff; }
  @media (max-width: 700px) { .stage { height: 300px; } .stage.ring { height: 360px; } .who h1 { font-size: 48px; } }

  /* the viewer: a case (or poster) opened full screen, what it is on the right */
  .viewer { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr); align-items: center;
            background: radial-gradient(120% 120% at 30% 40%, color-mix(in oklab, var(--ground, #1a1420) 85%, #000), #050406 75%); animation: vin .35s ease; }
  .viewer[hidden] { display: none; }
  @keyframes vin { from { opacity: 0; } }
  body.viewing { overflow: hidden; }
  .vstage { position: relative; height: 100%; display: grid; place-items: center; }
  .vstage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .vstage img { max-height: 78vh; max-width: 80%; border-radius: 14px; box-shadow: 0 30px 80px #000c; }
  .vinfo { padding: 40px 56px 40px 8px; max-width: 560px; max-height: 100svh; overflow-y: auto; scrollbar-width: thin; }
  .vtag { margin: -4px 0 14px; font: italic 400 20px "Instrument Serif", serif; color: #ffffffb3; }
  .vgenres { display: flex; flex-wrap: wrap; gap: 6px; margin: -12px 0 18px; }
  .vgenres span { border: 1px solid #ffffff33; border-radius: 999px; padding: 2px 11px; font-size: 13px; color: #ffffffcc; }
  .vscores { display: flex; flex-wrap: wrap; gap: 18px; margin: 0 0 16px; font: 600 16px "Outfit"; }
  .vscores small { font: 500 11px "JetBrains Mono"; letter-spacing: .05em; color: #ffffff80; text-transform: uppercase; margin-left: 2px; }
  .vscores .you { color: var(--accent, #ffb648); }
  .vover { margin: 0 0 18px; color: #ffffffd0; font-size: 15px; line-height: 1.55; }
  .vfacts { margin: 0 0 24px; display: grid; gap: 6px; font-size: 14px; }
  .vrow { display: grid; grid-template-columns: 96px 1fr; gap: 10px; } .vrow dt { color: #ffffff80; } .vrow dd { margin: 0; color: #ffffffd9; }
  .vinfo h2 { margin: 6px 0 12px; font: italic 400 clamp(40px, 5vw, 72px)/1 "Instrument Serif", serif; }
  .vmeta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: #ffffffb3; font-size: 15px; margin-bottom: 20px; }
  .vmeta span + span::before { content: "·"; margin-right: 14px; color: #ffffff55; }
  .vgo { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px; border-radius: 999px; background: #fff; color: #111; font: 700 16px "Outfit"; text-decoration: none; }
  .vgo:hover { background: var(--accent, #ff8a3d); color: #111; }
  .vnote { color: #ffffff80; }
  .vclose { position: absolute; top: 18px; right: 22px; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #ffffff33; background: #0006; color: #fff; font-size: 26px; line-height: 1; cursor: pointer; }
  @media (max-width: 800px) {
    .viewer { grid-template-columns: minmax(0, 100vw); width: 100vw; grid-template-rows: 52svh auto; align-items: start; overflow-y: auto; overflow-x: hidden; }
    .vinfo *, .vstage { min-width: 0; max-width: 100%; } .vover, .vrow dd { overflow-wrap: anywhere; }
    .vinfo { padding: 8px 22px 40px; max-width: none; max-height: none; overflow: visible; min-width: 0; }
    .vinfo h2 { font-size: 44px; } .vrow { grid-template-columns: 84px minmax(0, 1fr); } .vstage img { max-height: 50svh; }
  }
  .viewswitch { position: fixed; top: 12px; right: 12px; z-index: 30; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: #000a; border: 1px solid #ffffff26; backdrop-filter: blur(10px); }
  .viewswitch a { font: 600 12px "Outfit"; color: #ddd; text-decoration: none; padding: 5px 12px; border-radius: 999px; }
  .viewswitch a[aria-pressed="true"] { background: #fff; color: #111; }
  body.viewing .viewswitch { display: none; }
  /* simple view: plain posters */
  .prow { display: flex; gap: 12px; overflow-x: auto; padding: 16px 0 8px; scroll-snap-type: x proximity; scrollbar-width: thin; }
  .duo .prow { padding-inline: 0; }
  .ptile { flex: none; width: 128px; padding: 0; border: 0; background: none; color: #ffffffcc; text-align: left; cursor: pointer; scroll-snap-align: start; }
  .ptile img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 10px; background: #ffffff10; display: block; transition: transform .2s; }
  .ptile:hover img { transform: translateY(-3px); }
  .ptile span { display: block; margin-top: 6px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ptile.extra { opacity: .5; }
  section.shelf h2.under.simple { margin: 4px 0 0; }
  body[data-view="simple"] .shelfswitch { display: none; }
  .pwall { position: relative; z-index: 2; padding-bottom: 60px; }
  .pwall h3 { margin: 26px 0 10px; font: italic 400 30px "Instrument Serif", serif; } .pwall h3 small { font: 500 12px "JetBrains Mono"; color: #ffffff80; font-style: normal; margin-left: 8px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
  .pgrid .ptile { width: auto; }
  body[data-view="simple"] .whead .hint { display: none; }
  body[data-view="simple"] .wallstage { position: static; }
  /* the card of a case taken out */
  .detail { position: absolute; right: 16px; top: 16px; z-index: 3; width: min(330px, calc(100% - 32px)); padding: 16px; border-radius: 14px; background: #000b; backdrop-filter: blur(14px); border: 1px solid #ffffff1f; opacity: 0; transform: translateY(8px); transition: .35s; pointer-events: none; }
  .detail.on { opacity: 1; transform: none; pointer-events: auto; }
  .detail h3 { margin: 2px 0 6px; font: italic 400 30px/1.02 "Instrument Serif", serif; }
  .detail .meta { display: flex; gap: 10px; color: #ffffffa0; margin-bottom: 8px; }
  .detail a { font-weight: 600; }
  @media (max-width: 700px) { .detail { top: auto; bottom: 10px; } }

  /* the watch history: the wall fixed behind a tall page that scrolls it */
  #watched { display: none; }
  body.watched #profile { display: none; }
  body.watched #watched { display: block; }
  .whead { position: sticky; top: 0; z-index: 6; background: linear-gradient(var(--page) 70%, #0e0c1000); }
  .whead .wrap { display: flex; gap: 16px; align-items: center; padding-top: 18px; padding-bottom: 22px; flex-wrap: wrap; }
  .whead h1 { margin: 0; font: italic 400 48px/1 "Instrument Serif", serif; }
  .whead .count { color: #ffffff80; font: 600 18px "Outfit"; }
  .whead button, .whead a.back { font: 600 13px "Outfit"; color: #ddd; background: #ffffff10; border: 1px solid #ffffff26; border-radius: 999px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
  .whead button[aria-pressed="true"] { background: #fff; color: #111; }
  .wallstage { position: fixed; inset: 0; z-index: 1; }
  #wallSpacer { position: relative; z-index: 2; pointer-events: none; }
  .month { position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none; font: italic 400 30px "Instrument Serif", serif; color: #fff; text-shadow: 0 2px 14px #000; white-space: nowrap; }
  .month small { font: 500 11px "JetBrains Mono"; letter-spacing: .08em; color: #ffffff90; margin-left: 10px; font-style: normal; }
  #wallDetail { position: fixed; z-index: 8; }
  @media (max-width: 700px) { .whead .hint { display: none; } .whead h1 { font-size: 40px; } }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div class="lab-note mono">Lab · a mock of alex's profile</div>

<div id="profile">
  <header class="top">
    <div class="wrap">
      <div>
        <div class="who"><span id="avatar"></span><div><div class="mono" style="opacity:.7">Profile</div><h1 id="name">alex</h1></div></div>
        <div class="nums" id="nums"></div>
      </div>
      <div class="cards">
        <section class="card" aria-label="Around the world">
          <h3>Around the world <span id="ncountries"></span></h3>
          <div class="map" id="map"></div>
          <p class="top3" id="top3"></p>
        </section>
        <section class="card" aria-label="Ratings">
          <div class="rhead"><div><h3>Ratings</h3><p class="avg" id="avg"></p></div><div class="rtabs" id="rtabs"></div></div>
          <ol class="bars" id="bars"></ol><ol class="ticks" id="ticks"></ol>
        </section>
      </div>
    </div>
  </header>
  <main class="wrap" id="shelves"></main>
  <div class="wrap" style="margin:34px auto 60px">
    <section class="shelf">
      <h2>Recently watched</h2>
      <div class="stage ring bleed" id="ring"></div>
    </section>
  </div>
</div>

<div id="watched">
  <div class="whead"><div class="wrap">
    <a class="back" href="#">← Profile</a>
    <h1>Watched</h1><span class="count" id="wcount"></span>
    <button id="byMonth" aria-pressed="true">By month</button>
    <span class="mono hint" style="opacity:.6">hover a cover · click to take it out · esc put back</span>
  </div></div>
  <div class="wallstage" id="wall"></div>

<script type="module">
// ── 3D or simple ────────────────────────────────────────────────────────────────────────────
// Simple: the same page with plain posters — no WebGL, and three.js is not even downloaded. Chosen

const VIEW = (() => {
  const asked = new URLSearchParams(location.search).get("view")

  try { const kept = localStorage.getItem("roki:lab:view"); if (kept) return kept } catch {}
  const gl = (() => { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")) } catch { return false } })()
  const weak = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2)

document.body.dataset.view = VIEW
const THREE = VIEW === "3d" ? await import("three") : null
const { RoundedBoxGeometry } = VIEW === "3d" ? await import("three/addons/geometries/RoundedBoxGeometry.js") : {}

const W = 1.35, H = 1.9, D = 0.14, LID = 0.028
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])

// ── colours from a poster (OKLCH buckets, as the other labs) ─────────────────────────────────
function oklch(r, g, b) {
  const l = (c) => (c /= 255) <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4
  const [R, G, B] = [l(r), l(g), l(b)]

  const a = 1.9779984951 * L - 2.428592205 * M + 0.4505937099 * S, bb = 0.0259040371 * L + 0.7827717662 * M - 0.808675766 * S
  return { l: 0.2104542553 * L + 0.793617785 * M - 0.0040720468 * S, c: Math.hypot(a, bb), h: (Math.atan2(bb, a) * 180 / Math.PI + 360) % 360 }
}
function paletteOf(img) {
  try {
    const cv = document.createElement("canvas"); cv.width = 24; cv.height = 36
    const g = cv.getContext("2d", { willReadFrequently: true }); g.drawImage(img, 0, 0, 24, 36)
    const d = g.getImageData(0, 0, 24, 36).data, buckets = new Map()
    for (let i = 0; i < d.length; i += 4) {
      const o = oklch(d[i], d[i + 1], d[i + 2]); if (o.l < 0.12 || o.l > 0.95 || o.c < 0.03) continue
      const k = Math.round(o.h / 30), b = buckets.get(k) || { n: 0, c: 0, x: 0, y: 0 }
      b.n++; b.c += o.c; b.x += Math.cos(o.h * Math.PI / 180); b.y += Math.sin(o.h * Math.PI / 180); buckets.set(k, b)

    const main = list[0] || { h: 300, c: 0.02 }, lively = list.filter((b) => b.n > 12).sort((a, b) => b.c - a.c)[0] || main
    return pal(main, lively)
  } catch { return pal({ h: 300, c: 0.02 }, { h: 30, c: 0.12 }) }
}
function pal(main, lively) {

  return { spine: css(42, Math.min(Math.max(main.c, 0.04), 0.13).toFixed(3), main.h), ink: css(95, 0.03, main.h),
           light: css(78, Math.min(Math.max(lively.c, 0.08), 0.16).toFixed(3), lively.h), ground: css(20, Math.min(main.c, 0.06).toFixed(3), main.h) }
}
const toColor = (() => { const c = document.createElement("canvas").getContext("2d"); return (css) => { c.fillStyle = "#000"; c.fillStyle = css; c.fillRect(0, 0, 1, 1); const [r, g, b] = c.getImageData(0, 0, 1, 1).data; return new THREE.Color().setRGB(r / 255, g / 255, b / 255, THREE.SRGBColorSpace) } })()

// One picture per address for the whole page: the image, its texture and its palette.
const pictures = new Map()
function picture(url) {
  if (!url) return Promise.resolve(null)
  if (!pictures.has(url)) pictures.set(url, new Promise((res) => {
    const img = new Image(); img.crossOrigin = "anonymous"; img.decoding = "async"
    img.onload = () => {
      let tex = null

      res({ img, tex, pal: paletteOf(img) })

}
function spineTexture(item, p) {
  const c = document.createElement("canvas"); c.width = 72; c.height = 980
  const g = c.getContext("2d")
  g.fillStyle = p.spine; g.fillRect(0, 0, 72, 980)
  g.fillStyle = "#ffffff18"; g.fillRect(4, 0, 2, 980); g.fillStyle = "#00000040"; g.fillRect(64, 0, 8, 980)
  g.save(); g.translate(46, 900); g.rotate(-Math.PI / 2); g.fillStyle = p.ink; g.font = "600 34px Outfit"
  let t = item.title || ""; while (g.measureText(t).width > 760 && t.length > 3) t = t.slice(0, -2)
  if (t !== item.title) t = t.trimEnd() + "…"
  g.fillText(t, 0, 0); g.restore()
  if (item.year) { g.save(); g.translate(46, 960); g.rotate(-Math.PI / 2); g.globalAlpha = 0.75; g.font = "500 22px 'JetBrains Mono'"; g.fillStyle = p.ink; g.fillText(item.year, 0, 0); g.restore() }

// ── geometry and materials, shared by every stage ──────────────────────────────────────────
let plastic, inner, sleeveMat, hubMat, trayGeo, lidGeo, slimGeo, faceGeo, spineGeo, discGeo, hubGeo
if (THREE) {
  plastic = new THREE.MeshStandardMaterial({ color: 0x101012, roughness: 0.32, metalness: 0.05 })
  inner = new THREE.MeshStandardMaterial({ color: 0x1b1b20, roughness: 0.6 })
  sleeveMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.06, transparent: true, opacity: 0.1, clearcoat: 1, clearcoatRoughness: 0.05 })
  hubMat = new THREE.MeshStandardMaterial({ color: 0xc9ccd4, roughness: 0.25, metalness: 0.9 })
  trayGeo = new RoundedBoxGeometry(W, H, D - LID, 2, 0.02), lidGeo = new RoundedBoxGeometry(W, H, LID, 2, 0.012)
  slimGeo = new RoundedBoxGeometry(W, H, D, 2, 0.02)
  faceGeo = new THREE.PlaneGeometry(W - 0.04, H - 0.04), spineGeo = new THREE.PlaneGeometry(D, H - 0.01)
  discGeo = new THREE.CircleGeometry(0.6, 64), hubGeo = new THREE.RingGeometry(0.07, 0.17, 48)
}

// A full case (opens): tray, a lid on the spine's hinge with the cover under a sleeve, a disc.
// A manga is a book, not a disc case: a tankōbon (≈ 13 × 18 cm, the page block cream, a soft cover
// that opens like a book's), the same shape of object as a case (`hinge`, `cover`, `spine`, `back`)
// so the shelves and the viewer move it the same way. Open, the inside of the cover is the cover
// art again (a jacket's flap) and the first page carries the title, set like a title page.
const BW = 1.3, BH = 1.84, BD = 0.22, BC = 0.012
let paper, pageEdge
function book(item, idx) {
  paper ||= new THREE.MeshStandardMaterial({ color: 0xf1ead8, roughness: 0.9 })
  pageEdge ||= new THREE.MeshStandardMaterial({ map: edgeTexture(), roughness: 0.95 })

  // The page block, a little inside the cover on three sides.
  const block = new THREE.Mesh(new THREE.BoxGeometry(BW - 0.03, BH - 0.04, BD - 2 * BC), [pageEdge, paper, pageEdge, pageEdge, paper, paper])
  block.position.x = 0.012; block.castShadow = true; g.add(block)
  // The first page, its title set on it (made when the book is dressed).

  first.position.set(0.012, 0, (BD - 2 * BC) / 2 + 0.001); g.add(first)
  // The back cover and the spine (the spine flat against the block's left side).
  const backC = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BC), new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6 }))
  backC.position.z = -BD / 2 + BC / 2; backC.castShadow = true; g.add(backC)
  const spine = new THREE.Mesh(new THREE.PlaneGeometry(BD, BH), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.55 }))
  spine.rotation.y = -Math.PI / 2; spine.position.x = -BW / 2 - 0.001; g.add(spine)
  // The front cover on a hinge at the spine.
  const hinge = new THREE.Group(); hinge.position.set(-BW / 2, 0, BD / 2 - BC); g.add(hinge)
  const board = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BC), new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6 }))
  board.position.set(BW / 2, 0, BC / 2); board.castShadow = true; hinge.add(board)
  const cover = new THREE.Mesh(new THREE.PlaneGeometry(BW, BH), new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.55 }))
  cover.position.set(BW / 2, 0, BC + 0.001); hinge.add(cover)
  const flap = new THREE.Mesh(new THREE.PlaneGeometry(BW - 0.02, BH - 0.02), paper.clone())
  flap.rotation.y = Math.PI; flap.position.set(BW / 2, 0, -0.001); hinge.add(flap)
  g.traverse((m) => { m.userData.idx = idx })

  dress(c)

}
// The page edges: fine lines of paper.
function edgeTexture() {
  const c = document.createElement("canvas"); c.width = 8; c.height = 128
  const g = c.getContext("2d"); g.fillStyle = "#eee6d2"; g.fillRect(0, 0, 8, 128)
  for (let y = 0; y < 128; y += 2) { g.fillStyle = `rgba(150,135,110,${0.12 + Math.random() * 0.12})`; g.fillRect(0, y, 8, 1) }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 6); t.colorSpace = THREE.SRGBColorSpace
  return t
}
// The first page: the title and its authors, set quietly on cream paper.
function titlePage(item, pal) {
  const c = document.createElement("canvas"); c.width = 520; c.height = 736
  const g = c.getContext("2d")
  g.fillStyle = "#f3ecdb"; g.fillRect(0, 0, 520, 736)
  g.fillStyle = pal ? pal.spine : "#333"; g.fillRect(60, 210, 400, 3)
  g.fillStyle = "#2a2622"; g.textAlign = "center"
  let size = 52; g.font = `italic 400 ${size}px "Instrument Serif", serif`
  const words = (item.title || "").split(" "), lines = []; let line = ""
  for (const w of words) { const t = line ? line + " " + w : w; if (g.measureText(t).width > 400 && line) { lines.push(line); line = w } else line = t }
  if (line) lines.push(line)
  lines.slice(0, 4).forEach((l, i) => g.fillText(l, 260, 290 + i * 60))
  const d = (data.details || {})[`manga:${item.id}`]
  const au = d && tidy(d).authors
  if (au && au.length) { g.font = '500 20px "Outfit"'; g.fillStyle = "#6b625a"; g.fillText(au.join(" · "), 260, 300 + lines.length * 60 + 30) }
  g.fillStyle = pal ? pal.spine : "#333"; g.fillRect(230, 640, 60, 3)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4

}

function fullCase(item, idx) {
  if (item.type === "manga") return book(item, idx)
  const g = new THREE.Group()
  const tray = new THREE.Mesh(trayGeo, plastic); tray.position.z = -LID / 2; tray.castShadow = true; g.add(tray)
  const trayFace = new THREE.Mesh(faceGeo, inner); trayFace.position.z = -LID / 2 + (D - LID) / 2 + 0.001; g.add(trayFace)
  const disc = new THREE.Group(); disc.position.z = trayFace.position.z + 0.004
  const discFace = new THREE.Mesh(discGeo, new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.3, metalness: 0.5 })); disc.add(discFace)
  const hub = new THREE.Mesh(hubGeo, hubMat); hub.position.z = 0.002; disc.add(hub); g.add(disc)
  const back = new THREE.Mesh(faceGeo, plastic.clone()); back.rotation.y = Math.PI; back.position.z = -D / 2 - 0.001; g.add(back)
  const hinge = new THREE.Group(); hinge.position.set(-W / 2, 0, (D - LID) / 2); g.add(hinge)
  const lid = new THREE.Mesh(lidGeo, plastic); lid.position.set(W / 2, 0, LID / 2); lid.castShadow = true; hinge.add(lid)
  const cover = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.55 })); cover.position.set(W / 2, 0, LID + 0.001); hinge.add(cover)
  const sleeve = new THREE.Mesh(faceGeo, sleeveMat); sleeve.position.set(W / 2, 0, LID + 0.004); hinge.add(sleeve)
  const lidIn = new THREE.Mesh(faceGeo, inner); lidIn.rotation.y = Math.PI; lidIn.position.set(W / 2, 0, -0.001); hinge.add(lidIn)
  const spine = new THREE.Mesh(spineGeo, new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.45 })); spine.rotation.y = -Math.PI / 2; spine.position.x = -W / 2 - 0.0015; g.add(spine)
  g.traverse((m) => { m.userData.idx = idx })

}
// A slim case for the wall: a body and the cover (hundreds of them; the full one is made when one is taken out).
function slimCase(item, idx) {
  const g = new THREE.Group()
  const body = new THREE.Mesh(slimGeo, plastic); g.add(body)
  const cover = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({ color: 0x232026, roughness: 0.55 })); cover.position.z = D / 2 + 0.002; g.add(cover)
  const sleeve = new THREE.Mesh(faceGeo, sleeveMat); sleeve.position.z = D / 2 + 0.005; g.add(sleeve)
  g.traverse((m) => { m.userData.idx = idx })

}
function dress(c) {
  return picture(c.item.poster).then((p) => {
    if (!p) return
    c.pal = p.pal
    c.cover.material = new THREE.MeshStandardMaterial({ map: p.tex, roughness: 0.5 })
    if (c.spine) document.fonts.ready.then(() => { c.spine.material = new THREE.MeshStandardMaterial({ map: spineTexture(c.item, p.pal), roughness: 0.45 }) })
    if (c.back) c.back.material.color = toColor(p.pal.spine).multiplyScalar(0.6)
    if (c.book) {
      c.back.material.color = toColor(p.pal.spine)
      document.fonts.ready.then(() => { c.first.material = new THREE.MeshStandardMaterial({ map: titlePage(c.item, p.pal), roughness: 0.9 }) })
      const t = p.tex.clone(); t.needsUpdate = true
      c.flap.material = new THREE.MeshStandardMaterial({ map: t, roughness: 0.7, color: 0x9a9a9a })

function discArt(c) {
  if (c.discLoaded || c.book) return; c.discLoaded = true
  const url = c.item.backdrop || c.item.poster
  picture(url).then((p) => {
    if (!p) return
    const tex = p.tex.clone(); tex.needsUpdate = true
    const a = p.img.width / p.img.height
    if (a > 1) { tex.repeat.set(1 / a, 1); tex.offset.set((1 - 1 / a) / 2, 0) } else { tex.repeat.set(1, a); tex.offset.set(0, (1 - a) / 2) }

  })

// ── springs ─────────────────────────────────────────────────────────────────────────────────
function spring(x, v, t, dt, k = 140) { const c = 2 * Math.sqrt(k) * 0.62; v += ((t - x) * k - v * c) * dt; return [x + v * dt, v] }
function motion(c) {
  Object.assign(c, { pos: new THREE.Vector3(0, -8, 0), vel: new THREE.Vector3(), tpos: new THREE.Vector3(), rot: new THREE.Vector3(), rvel: new THREE.Vector3(), trot: new THREE.Vector3(), lid: 0, lvel: 0, tlid: 0, spin: 0, hover: 0, thover: 0 })
  return c
}
function step(c, dt) {
  for (const ax of ["x", "y", "z"]) { ;[c.pos[ax], c.vel[ax]] = spring(c.pos[ax], c.vel[ax], c.tpos[ax], dt); ;[c.rot[ax], c.rvel[ax]] = spring(c.rot[ax], c.rvel[ax], c.trot[ax], dt, 110) }
  c.hover += (c.thover - c.hover) * (1 - Math.exp(-dt * 14))
  c.g.position.copy(c.pos); c.g.rotation.set(c.rot.x, c.rot.y, c.rot.z, "YXZ")
  if (c.full) { ;[c.lid, c.lvel] = spring(c.lid, c.lvel, c.tlid, dt, 70); c.hinge.rotation.y = c.lid; if (c.disc && c.lid < -0.4) { c.spin += dt * 2.2; c.disc.rotation.z = -c.spin } }
}

// ── a stage: one canvas, its scene and lights, the cases in an arrangement ────────────────
const stages = []
class Stage {
  constructor(el, opts) {
    this.el = el; this.opts = opts; this.cases = []; this.out = null; this.pointer = { x: 0, y: 0, in: false }
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
    this.renderer.shadowMap.enabled = true; this.renderer.shadowMap.type = THREE.PCFSoftShadowMap
    this.renderer.outputColorSpace = THREE.SRGBColorSpace; this.renderer.toneMapping = THREE.ACESFilmicToneMapping
    el.appendChild(this.renderer.domElement)
    this.scene = new THREE.Scene()
    this.camera = new THREE.PerspectiveCamera(opts.fov || 32, 1, 0.1, 200)
    this.scene.add(new THREE.HemisphereLight(0xcfd6ff, 0x1a1410, 0.6))
    const key = new THREE.DirectionalLight(0xfff1de, 2.2); key.position.set(-4, 8, 6); key.castShadow = true
    key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02
    Object.assign(key.shadow.camera, { left: -10, right: 10, top: 8, bottom: -4, near: 1, far: 30 })
    this.key = key; this.scene.add(key, key.target)
    const rim = new THREE.DirectionalLight(0x8fb4ff, 0.6); rim.position.set(6, 3, -5); this.scene.add(rim)
    this.tint = new THREE.PointLight(0xffffff, 0, 12, 1.6); this.scene.add(this.tint)
    if (opts.floor !== false) {
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.45 }))
      floor.rotation.x = -Math.PI / 2; floor.position.y = opts.floorY ?? 0; floor.receiveShadow = true; this.scene.add(floor)
    }
    this.camPos = new THREE.Vector3(0, 2, 10); this.camLook = new THREE.Vector3(0, 1, 0); this.tPos = new THREE.Vector3(); this.tLook = new THREE.Vector3()
    this.detail = opts.detail || Object.assign(document.createElement("div"), { className: "detail" })
    if (!opts.detail) el.appendChild(this.detail)
    this.visible = true
    new IntersectionObserver(([e]) => { this.visible = e.isIntersecting }).observe(el)
    new ResizeObserver(() => this.resize()).observe(el); this.resize()

  }

    const ray = new THREE.Raycaster(); ray.setFromCamera(p, this.camera)
    const hit = ray.intersectObjects(this.cases.filter((c) => c.g.visible).map((c) => c.g), true)[0]

    cv.addEventListener("pointermove", (e) => {

      if (down) { const dx = e.clientX - down.x; down.moved = Math.max(down.moved, Math.abs(dx)); this.opts.drag?.call(this, e.movementX || 0, dx) }

    c.pal ? show() : picture(c.item.poster).then((p) => { if (p) { c.pal = p.pal; show() } })

// ── the wall of covers (watch history) ─────────────────────────────────────────────────────

// Manga sources hand their facts over with their own labels ("Year Published: 2018", "This is
// ON-GOING series", "Written By: X, Illustrated By: Y"): cleaned to the plain facts.
function tidy(d) {
  const o = {...d}
  if (o.year && !/\d{4}/.test(o.year)) o.year = null
  else if (o.year) o.year = String(o.year).match(/\d{4}/)[0]
  if (o.status) {
    const st = String(o.status).toLowerCase()
    o.status = /on-?going|publishing|releasing/.test(st) ? "Ongoing" : /complete|finished|ended/.test(st) ? (o.status === "Ended" ? "Ended" : "Completed") : /hiatus/.test(st) ? "On hiatus" : o.status
  }
  if (o.authors) o.authors = [...new Set(o.authors.flatMap((a) => String(a).split(/,|;|\band\b/)).map((a) => a.replace(/^\s*(written|illustrated|art|story)\s*by\s*:?\s*/i, "").trim()).filter(Boolean))]
  return o
}

// Simple: the world in dots, a halftone — every few pixels a dot where there is land, orange where
// something was watched; hovering one names its country.
async function dotMap(el) {
  const svg = await (await fetch("/data/world-110m.svg")).text()
  const shapes = [...svg.matchAll(/data-c="([A-Z]{2})" d="([^"]+)"><title>([^<]*)</g)].map(([, c, d, name]) => ({ c, name, path: new Path2D(d) }))
  const W0 = 960, H0 = 470, step = 7
  const id = document.createElement("canvas"); id.width = W0; id.height = H0
  const ig = id.getContext("2d", { willReadFrequently: true })
  shapes.forEach((sh, i) => { ig.fillStyle = `rgb(${(i + 1) & 255},${(i + 1) >> 8},0)`; ig.fill(sh.path) })
  const px = ig.getImageData(0, 0, W0, H0).data
  // The country at a point: the id picture's guess, checked against the shape itself (the picture
  // blends colours along borders), else found among them all.
  const at = (x, y) => {
    const k = (Math.floor(y) * W0 + Math.floor(x)) * 4
    if (!px[k + 3]) return null
    const guess = shapes[px[k] + px[k + 1] * 256 - 1]
    if (guess && ig.isPointInPath(guess.path, x, y)) return guess
    return shapes.find((sh) => ig.isPointInPath(sh.path, x, y)) || null
  }
  const dots = []
  for (let y = step / 2; y < H0; y += step) for (let x = step / 2; x < W0; x += step) { const sh = at(x, y); if (sh) dots.push({ x, y, sh }) }
  const cv = document.createElement("canvas"); el.innerHTML = ""; el.appendChild(cv)
  const tip = Object.assign(document.createElement("div"), { className: "maptip" }); el.appendChild(tip)
  let hot = null
  const draw = () => {
    const w = el.clientWidth, h = w * H0 / W0, dpr = Math.min(devicePixelRatio, 2)
    cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + "px"
    const g = cv.getContext("2d"), k = w / W0; g.setTransform(dpr * k, 0, 0, dpr * k, 0, 0)
    for (const d of dots) {
      const n = C.counts[d.sh.c] || 0, on = hot === d.sh.c
      g.fillStyle = n ? `rgba(255,${Math.round(150 - 60 * heat(n))},40,${0.35 + 0.65 * heat(n)})` : "rgba(255,255,255,.16)"
      g.beginPath(); g.arc(d.x, d.y, (on ? 3.2 : 2.3) * (n ? 1 : 0.8), 0, Math.PI * 2); g.fill()
    }
  }
  new ResizeObserver(draw).observe(el)
  cv.addEventListener("pointermove", (e) => {
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W0, y = (e.clientY - r.top) / r.height * H0
    const sh = at(x, y), c = sh?.c || null
    if (c !== hot) { hot = c; draw() }
    tip.hidden = !sh; if (sh) { tip.innerHTML = `${esc(sh.name)} <b>${C.counts[c] || 0}</b>`; tip.style.left = `${e.clientX - r.left}px`; tip.style.top = `${e.clientY - r.top}px` }
    cv.style.cursor = sh && C.counts[c] ? "pointer" : ""
  })
  cv.addEventListener("pointerleave", () => { hot = null; tip.hidden = true; draw() })
  cv.addEventListener("click", () => { if (hot && C.counts[hot]) location.href = watchedIn(hot) })
}

// 3D: the world as a globe, slowly turning — what was watched lit in orange, the rest dark; drag to
// turn it, hover a country for its name and count, click to see what was watched from there.
async function globe(el) {
  const [{ feature }, d3] = await Promise.all([

  ])

  const code = {}; for (const [, c, name] of svg.matchAll(/data-c="([A-Z]{2})"[^>]*><title>([^<]*)</g)) code[name] = c
  const feats = feature(topo, topo.objects.countries).features
  const TW = 2048, TH = 1024
  const proj = d3.geoEquirectangular().scale(TW / (2 * Math.PI)).translate([TW / 2, TH / 2])
  const tex = document.createElement("canvas"); tex.width = TW; tex.height = TH
  const tg = tex.getContext("2d"), path = d3.geoPath(proj, tg)
  tg.fillStyle = "#0b0a12"; tg.fillRect(0, 0, TW, TH)
  const ids = document.createElement("canvas"); ids.width = TW; ids.height = TH
  const ig = ids.getContext("2d", { willReadFrequently: true }), ipath = d3.geoPath(proj, ig)
  feats.forEach((f, i) => {

    tg.beginPath(); path(f); tg.fillStyle = n ? `rgb(255,${Math.round(150 - 70 * heat(n))},40)` : "#2b2836"
    tg.globalAlpha = n ? 0.45 + 0.55 * heat(n) : 1; tg.fill(); tg.globalAlpha = 1
    tg.strokeStyle = "rgba(255,255,255,.18)"; tg.lineWidth = 1; tg.stroke()
    ig.beginPath(); ipath(f); ig.fillStyle = `rgb(${(i + 1) & 255},${(i + 1) >> 8},0)`; ig.fill()
  })
  const idpx = ig.getImageData(0, 0, TW, TH).data
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true })
  r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.outputColorSpace = THREE.SRGBColorSpace
  el.appendChild(r.domElement)
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, 0.35, 4.2); cam.lookAt(0, 0, 0)
  const map = new THREE.CanvasTexture(tex); map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = 8
  const ball = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), new THREE.MeshStandardMaterial({ map, emissiveMap: map, emissive: 0xffffff, emissiveIntensity: 0.35, roughness: 0.85 }))
  scene.add(ball)
  // A soft rim of light round it.

    transparent: true, side: THREE.BackSide, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: "varying vec3 n; void main(){ n = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "varying vec3 n; void main(){ float i = pow(0.75 - dot(n, vec3(0,0,1.0)), 3.0); gl_FragColor = vec4(1.0,0.55,0.25,1.0) * i; }",
  }))
  scene.add(halo)
  scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x221a14, 0.9))
  const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(-3, 2, 4); scene.add(sun)
  const tip = Object.assign(document.createElement("div"), { className: "maptip", hidden: true }); el.appendChild(tip)
  // Start looking at the country most was watched from.
  let yaw = -Math.PI / 2, pitch = 0.35, vy = 0, drag = null, hover = null, idle = 0
  const fit = () => { const w = el.clientWidth, h = el.clientHeight; if (w && h) { r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix() } }
  new ResizeObserver(fit).observe(el); fit()
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2()
  const pickAt = (e) => {
    const b = r.domElement.getBoundingClientRect(); ndc.set((e.clientX - b.left) / b.width * 2 - 1, -(e.clientY - b.top) / b.height * 2 + 1)
    ray.setFromCamera(ndc, cam); const hit = ray.intersectObject(ball)[0]; if (!hit) return null
    const u = hit.uv.x, v = hit.uv.y, k = (Math.floor((1 - v) * TH) * TW + Math.floor(u * TW)) * 4, i = idpx[k] + idpx[k + 1] * 256 - 1
    const f = i >= 0 ? feats[i] : null, c = f && code[f.properties.name]
    return f ? { name: f.properties.name, c, n: c ? C.counts[c] || 0 : 0 } : null
  }
  r.domElement.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, yaw, pitch, moved: 0 } })
  addEventListener("pointerup", () => { setTimeout(() => { drag = null }, 0) })
  r.domElement.addEventListener("pointermove", (e) => {
    if (drag && e.buttons) { drag.moved += Math.abs(e.movementX) + Math.abs(e.movementY); yaw = drag.yaw + (e.clientX - drag.x) * 0.008; pitch = Math.max(-1.1, Math.min(1.1, drag.pitch + (e.clientY - drag.y) * 0.006)); idle = 0 }
    hover = pickAt(e); const b = r.domElement.getBoundingClientRect()
    tip.hidden = !hover; if (hover) { tip.innerHTML = `${esc(hover.name)} <b>${hover.n}</b>`; tip.style.left = `${e.clientX - b.left}px`; tip.style.top = `${e.clientY - b.top}px` }
    r.domElement.style.cursor = drag && e.buttons ? "grabbing" : hover?.n ? "pointer" : "grab"
  })
  r.domElement.addEventListener("pointerleave", () => { hover = null; tip.hidden = true })
  r.domElement.addEventListener("click", () => { if (hover?.n && hover.c && !(drag && drag.moved > 6)) location.href = watchedIn(hover.c) })
  const st = { visible: true, frame(t, dt) {

// 3D: the ratings as piles of cases lying flat, one pile per score, as high as how many got it, in
// the score's colour (the 10s gold); the top of each pile the best-known title at that score.
// Hovering a pile fans its titles out above it; a click on one opens it.
function caseStacks(el) {
  const MAXH = 24, GAP = 1.75
  const piles = []
  let kind = "all", fan = []
  const flat = new THREE.BoxGeometry(W * 0.92, D * 0.9, H * 0.92)
  const labels = Object.assign(document.createElement("div"), { className: "slabels" }); el.appendChild(labels)
  const st = new Stage(el, {
    label: "ratings", floorY: 0, fov: 28, outDist: 6,
    place() {
      // Which pile is under the pointer (the fan above counts as its pile).
      const P = this.pointer
      let hot = null
      if (P.in) {
        const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(P.x, -P.y), this.camera)
        const hit = ray.intersectObjects(piles.flatMap((p) => p.meshes))[0]
        hot = hit ? piles.find((p) => p.meshes.includes(hit.object)) : null
        if (!hot && this.cases.some((c) => c.thover > 0)) hot = this.fanOf
      }
      if (hot !== this.fanOf) setFan(hot)
      piles.forEach((p) => {
        const lift = p === hot ? 0.18 : 0
        p.meshes.forEach((m, j) => { m.position.y += ((j + 0.5) * D * 0.95 + lift - m.position.y) * 0.25 })
      })
      // The fan: up to five titles standing over the pile, spread like a hand.
      fan.forEach((c, k) => {
        const n = fan.length, a = (k - (n - 1) / 2) * 0.22
        const base = this.fanOf ? this.fanOf.x : 0, top = this.fanOf ? this.fanOf.meshes.length * D * 0.95 : 0
        // In front of the piles and a little above the tallest, so it is never cut by the frame.
        const x = Math.max(-6, Math.min(6, base))
        c.tpos.set(x + Math.sin(a) * 2.4, 2.6 + Math.cos(a) * 0.5 + 0.3 * c.hover, 3.2 + k * 0.03); c.trot.set(-0.2, 0, -a)
      })
      const span = piles.length * GAP
      this.tPos.set(0, 6.5, fit(this, span + 1.5, 7) * 0.95); this.tLook.set(0, 1.6, 0)
      // The numbers: the count over each pile, the score under it.
      for (const p of piles) {
        const top = new THREE.Vector3(p.x, p.meshes.length * D * 0.95 + 0.4, 0).project(this.camera)
        const bot = new THREE.Vector3(p.x, 0, H * 0.6).project(this.camera)
        const w = el.clientWidth, h = el.clientHeight
        p.n.style.transform = `translate(${(top.x + 1) / 2 * w}px, ${(1 - top.y) / 2 * h - 18}px)`
        p.s.style.transform = `translate(${(bot.x + 1) / 2 * w}px, ${(1 - bot.y) / 2 * h + 4}px)`
        p.n.style.opacity = p === hot || !hot ? 1 : 0.35
      }
    },
  })
  const titlesAt = (score) => data.history.filter((h) => h.score && Math.floor(h.score) === score && (kind === "all" || h.type === kind)).slice(0, 5)
  function setFan(p) {
    for (const c of fan) { st.scene.remove(c.g); st.cases = st.cases.filter((x) => x !== c) }
    fan = []; st.fanOf = p
    if (!p) return
    fan = titlesAt(p.score).map((it, k) => { const c = st.add(fullCase(it, 500 + k)); c.pos.set(p.x, 0.2, 0); c.rot.set(-1.4, 0, 0); return c })
  }
  function build() {
    for (const p of piles) { for (const m of p.meshes) st.scene.remove(m); p.n.remove(); p.s.remove() }
    piles.length = 0; setFan(null)
    const b = R[kind]; if (!b) return
    // Whole scores: a half score goes with the score below it.
    const by = new Map(); for (const x of b.bars) { const k = Math.max(1, Math.floor(x.score)); by.set(k, (by.get(k) || 0) + x.n) }
    const max = Math.max(1, ...by.values())
    for (let sc = 1; sc <= 10; sc++) {
      const n = by.get(sc) || 0, count = n ? Math.max(1, Math.round(n / max * MAXH)) : 0
      const color = (b.bars.find((x) => Math.floor(x.score) === sc && Number.isInteger(x.score)) || {}).color || "#888"
      const col = sc === 10 ? new THREE.Color(0xf4c430) : toColor(color)
      const x = (sc - 5.5) * GAP
      const top = titlesAt(sc)[0]
      const meshes = []
      for (let j = 0; j < count; j++) {
        const mats = new THREE.MeshStandardMaterial({ color: col.clone().multiplyScalar(0.55 + 0.25 * ((j * 7) % 3) / 2), roughness: 0.4, metalness: sc === 10 ? 0.5 : 0.05 })
        const m = new THREE.Mesh(flat, mats); m.position.set(x + ((j * 37) % 5 - 2) * 0.02, 0, ((j * 53) % 5 - 2) * 0.02); m.rotation.y = ((j * 29) % 7 - 3) * 0.02
        m.castShadow = m.receiveShadow = true; st.scene.add(m); meshes.push(m)
      }
      // The pile's top case wears the poster of a title at that score.
      if (meshes.length && top) picture(top.poster).then((pp) => {
        if (!pp) return
        const t = pp.tex.clone(); t.needsUpdate = true; t.center.set(0.5, 0.5); t.rotation = Math.PI
        const m = meshes.at(-1), mats = Array(6).fill(m.material); mats[2] = new THREE.MeshStandardMaterial({ map: t, roughness: 0.5 }); m.material = mats
      })
      const nEl = Object.assign(document.createElement("span"), { className: "sn", textContent: n || "" })
      const sEl = Object.assign(document.createElement("span"), { className: "ss", textContent: sc })
      labels.append(nEl, sEl)
      piles.push({ score: sc, x, meshes, n: nEl, s: sEl })
    }
  }
  build()
  return { setKind(k) { kind = k; build() } }
}

ratings("all")

  document.querySelector(".cards").classList.add("objects")
  const mapEl = document.getElementById("map"); mapEl.innerHTML = ""; mapEl.classList.add("globe")
  globe(mapEl).catch((e) => { console.warn("globe", e); dotMap(mapEl) })
  const barsEl = document.getElementById("bars"), stackEl = document.createElement("div"); stackEl.className = "stacks"
  barsEl.replaceWith(stackEl); document.getElementById("ticks").remove()
  stacks = caseStacks(stackEl); ratings("all")
} else dotMap(document.getElementById("map"))

const recent = data.history.filter((h) => h.type === "movie" || h.type === "tv").slice(0, 24)
if (VIEW === "simple") document.getElementById("ring").replaceWith(simpleRow(recent, "recently watched"))
else carousel(document.getElementById("ring"), recent, "recently watched", "ring", true)

// The watch history, on its own "page".
let wall = null
const wallDetail = Object.assign(document.createElement("div"), { className: "detail", id: "wallDetail" }); document.body.appendChild(wallDetail)
function route() {
  const w = location.hash === "#watched"
  document.body.classList.toggle("watched", w)
  if (w && !wall) {
    document.getElementById("wcount").textContent = `${data.history.length} shown of ${fmt(P.watched)}`
    wall = VIEW === "simple" ? simpleWall(data.history) : wallStage(document.getElementById("wall"), data.history, document.getElementById("wallSpacer"))
  }
  for (const h of wall && wall.heads ? wall.heads() : []) h.el.style.display = w ? "" : "none"
  scrollTo(0, 0)
}
addEventListener("hashchange", route); route()
document.getElementById("byMonth").addEventListener("click", (e) => { const on = e.target.getAttribute("aria-pressed") !== "true"; e.target.setAttribute("aria-pressed", on); wall.setByMonth(on) })
// The 3D / Simple switch, top right.
const vs = document.createElement("nav"); vs.className = "viewswitch"
vs.innerHTML = [["3d", "3D"], ["simple", "Simple"]].map(([k, l]) => `<a href="?view=${k}${location.hash}" aria-pressed="${k === VIEW}">${l}</a>`).join("")
document.body.appendChild(vs)
document.querySelector(".whead a.back").addEventListener("click", (e) => { e.preventDefault(); history.pushState(null, "", location.pathname); route() })
addEventListener("keydown", (e) => { if (e.key === "Escape") closeViewer() })

let last = performance.now()
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now
  const onWall = document.body.classList.contains("watched")
  for (const s of stages) { if ((s === wall) === onWall) s.frame(now / 1000, dt) }
  requestAnimationFrame(loop)
}
if (VIEW === "3d") requestAnimationFrame(loop)
